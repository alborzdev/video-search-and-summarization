[property]
gpu-id=0
model-engine-file=/models/rfdetr-small-fp16-b2.engine
onnx-file=/models/rfdetr-small.onnx
labelfile-path=/opt/city/configs/labels.txt
batch-size=2
network-mode=2
network-type=0
num-detected-classes=6
interval=0
gie-unique-id=1
process-mode=1
cluster-mode=4
maintain-aspect-ratio=0
parse-bbox-func-name=NvDsInferParseCityRFDETR
custom-lib-path=/opt/city/libcity_parser.so
output-blob-names=dets;labels
# Exporter's graph input is 'input'; change preprocess tensor-name if the
# pinned ONNX artifact declares another name. FP32 IO with FP16 internals.

[class-attrs-all]
pre-cluster-threshold=0.35
