# Same demo capabilities and startup source gate as Thor; runtime endpoints and
# model identity are supplied by the independent Spark environment.
base: ../thor-local/official-edge/config_edge.yml

functions:
  vst_video_url:
    # Spark's CPU VIOS image crashes while constructing an overlay export.
    # Fresh VLM inspection uses the validated retained clip without overlays.
    overlay_config: false

general:
  front_end:
    streaming_ingest:
      # The opt-in Spark detector is independent of the inherited Thor worker.
      # Core-only deployments leave this endpoint empty.
      rtvi_cv_base_url: ${VSS_WAREHOUSE_RTVI_CV_URL:-''}
