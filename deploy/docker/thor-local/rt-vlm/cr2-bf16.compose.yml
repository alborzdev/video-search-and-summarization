# Explicit, inactive Thor lane for the content-locked official Hugging Face
# Cosmos Reason2 8B BF16 snapshot. It is never included by thor-local.sh.
services:
  rtvi-vlm:
    image: ${THOR_LOCAL_RTVI_VLM_IMAGE:-cti-vss-rt-vlm:thor-local}
    build: !reset null
    environment:
      VLM_MODEL_TO_USE: cosmos-reason2
      MODEL_PATH: /opt/nvidia/rtvi/models/cr2/snapshots/a9fae2cf89dc64db96b12860417f0eb403013bb9
      VLM_RUNTIME_STATE_DIR: /opt/nvidia/rtvi/runtime/cr2
      VLM_MODEL_SUPPORTS_AUDIO: "false"
      VLM_TRUST_REMOTE_CODE: "false"
      VLM_BATCH_SIZE: "1"
      NUM_VLM_PROCS: "1"
      NUM_GPUS: "1"
      VLLM_MAX_NUM_SEQS: "1"
      VLLM_GPU_MEMORY_UTILIZATION: ${THOR_LOCAL_CR2_GPU_MEMORY_UTILIZATION:-0.35}
      VLM_MAX_MODEL_LEN: ${THOR_LOCAL_CR2_MAX_MODEL_LEN:-32768}
      RTVI_EXTRA_ARGS: --max-live-streams 1
      VIA_VLM_ENDPOINT: ""
      VIA_VLM_API_KEY: ""
      VIA_VLM_OPENAI_MODEL_DEPLOYMENT_NAME: ""
      NGC_API_KEY: ""
      HF_TOKEN: ""
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "1"
      NVIDIA_API_KEY: NOAPIKEYSET
      OPENAI_API_KEY: NOAPIKEYSET
    volumes:
      - ${THOR_LOCAL_CR2_REPOSITORY_ROOT:?Set THOR_LOCAL_CR2_REPOSITORY_ROOT to the verified HF repository root}:/opt/nvidia/rtvi/models/cr2:ro
      - ${VSS_REPO_ROOT}/services/rtvi/rt-vlm/src/models/vllm_compatible/vllm_compatible_model.py:/opt/nvidia/rtvi/rtvi/models/vllm_compatible/vllm_compatible_model.py:ro
      - ${VSS_REPO_ROOT}/services/rtvi/rt-vlm/src/models/vllm_compatible/vllm_compatible_model.py:/opt/nvidia/rtvi/src/models/vllm_compatible/vllm_compatible_model.py:ro
    tmpfs:
      # vLLM may execute compiled cache objects; do not use noexec here.
      - /opt/nvidia/rtvi/runtime:rw,nosuid,nodev,mode=0700

  vss-agent:
    environment:
      VLM_MODE: local
      VLM_MODEL_TYPE: rtvi
      VLM_NAME: a9fae2cf89dc64db96b12860417f0eb403013bb9
      VLM_BASE_URL: http://127.0.0.1:${RTVI_VLM_PORT:-8018}
      RTVI_VLM_BASE_URL: http://127.0.0.1:${RTVI_VLM_PORT:-8018}
      NVIDIA_API_KEY: ""
      OPENAI_API_KEY: local

  lvs-server:
    environment:
      RTVI_VLM_URL: http://127.0.0.1:${RTVI_VLM_PORT:-8018}
      VIA_VLM_ENDPOINT: http://127.0.0.1:${RTVI_VLM_PORT:-8018}/v1/
      NVIDIA_API_KEY: ""
      OPENAI_API_KEY: local

  alert-bridge:
    environment:
      VLM_MODE: local
      VLM_NAME: a9fae2cf89dc64db96b12860417f0eb403013bb9
      VLM_BASE_URL: http://127.0.0.1:${RTVI_VLM_PORT:-8018}
      RTVI_VLM_BASE_URL: http://127.0.0.1:${RTVI_VLM_PORT:-8018}
      RTVI_VLM_MODEL_TO_USE: a9fae2cf89dc64db96b12860417f0eb403013bb9
