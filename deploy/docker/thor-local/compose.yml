# Small overlay for source-level Thor development. The released agent image
# supplies the runtime, while PYTHONPATH selects the checked-out source so local
# fixes can be qualified before a new immutable image is built.
services:
  # The upstream production broker reserves a fixed 6 GiB JVM heap. A
  # single-node Thor demo carries only the local VSS topics, so keep the
  # broker's steady-state and restart footprint bounded while retaining an
  # explicit override for larger operator workloads. This headroom is also
  # required to admit the exact 0.35 Cosmos3 RT-VLM allocation after reboot.
  kafka:
    environment:
      KAFKA_HEAP_OPTS: "${THOR_LOCAL_KAFKA_HEAP_OPTS:--Xms1G -Xmx1G}"

  # Elasticsearch's percentage watermarks mark a 1 TB Thor disk red despite
  # tens of GiB remaining. Absolute free-space thresholds retain a 10 GiB
  # flood-stage guard while allowing the single-node demo indices to allocate.
  elasticsearch:
    environment:
      cluster.routing.allocation.disk.watermark.low: 20gb
      cluster.routing.allocation.disk.watermark.high: 15gb
      cluster.routing.allocation.disk.watermark.flood_stage: 10gb

  # The upstream service installs logstash-codec-protobuf from Rubygems every
  # time a Kafka container is recreated. Thor instead builds an immutable
  # derivative from a checksum-locked official offline-plugin pack. Build-time
  # networking is disabled, and an empty command lets the stock entrypoint
  # start Logstash without repeating the online installer.
  logstash:
    image: ${THOR_LOCAL_LOGSTASH_IMAGE:-vss-logstash-protobuf:9.3.3-codec-1.3.0-thor-local}
    build:
      context: ${VSS_REPO_ROOT}/deploy/docker/services/infra/elk/logstash
      dockerfile: Dockerfile.protobuf-offline
      network: none
      args:
        LOGSTASH_BASE_IMAGE: ${LOGSTASH_BASE_IMAGE:-docker.elastic.co/logstash/logstash:9.3.3@sha256:a7ad817ec23e2f9c41f8fcd09bcce3c87710890f93612d4fd51de45074d7af2e}
        LOGSTASH_PROTOBUF_PACK: ${LOGSTASH_PROTOBUF_PACK:-logstash-codec-protobuf-1.3.0-logstash-9.3.3.zip}
        LOGSTASH_PROTOBUF_VERSION: "1.3.0"
    command: []
    environment:
      STREAM_TYPE: kafka
    volumes:
      - ${VSS_REPO_ROOT}/deploy/docker/thor-local/infra/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9600;
          printf "GET / HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3;
          read -r status <&3;
          [[ "$${status}" == HTTP/*" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Host-network Thor services reach Redis over loopback. The isolated SDR
  # dispatcher reaches it through Docker's private host gateway. Override the
  # broad upstream listener so the unauthenticated event bus is never exposed
  # on a physical or LAN interface.
  redis:
    command:
      - redis-server
      - /config/redis.conf
      - --bind
      - 127.0.0.1
      - ${THOR_LOCAL_MODEL_BIND_HOST:-127.0.0.1}
      # The SDR dispatcher reaches this explicitly bound docker0 address from
      # the private Compose bridge. Redis protected mode rejects that traffic
      # even though no physical/LAN interface is listening; the narrow bind is
      # the actual exposure boundary for this host-local graph.
      - --protected-mode
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 2s

  # Phoenix 14.15.0 enables telemetry pixels and external UI resources by
  # default. Thor is an offline operator profile, so disable both and keep the
  # trace/UI service on loopback. /readyz also proves its SQLite store works.
  phoenix:
    # A loopback bind inside the default bridge is unreachable from host-mode
    # HAProxy and Agent. Join the host network so 127.0.0.1 is the shared Thor
    # loopback, and remove the inherited bridge port publication.
    network_mode: host
    ports: !override []
    environment:
      PHOENIX_HOST: 127.0.0.1
      PHOENIX_PORT: "${PHOENIX_PORT:-6006}"
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
      PHOENIX_ENABLE_PROMETHEUS: "false"
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3.13
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:${PHOENIX_PORT:-6006}/readyz', timeout=3).getcode() == 200 else sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Grafana is published on loopback only. Allow anonymous Viewer access so
  # the bundled Thor dashboard and its read-only qualification probe work
  # without storing or transmitting an operator password.
  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"

  # Jetson's cpufreq trans_table pseudo-files exceed node-exporter's bounded
  # sysfs reader and make that collector fail on every scrape. Tegrastats is
  # the authoritative Thor clock/power source, so disable only cpufreq while
  # retaining the complete host/process/filesystem node-exporter surface.
  node-exporter:
    command: !override
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --no-collector.cpufreq

  # Jetson does not expose the datacenter DCGM contract. Reuse the already
  # locked VSS Agent Python runtime to translate the host's L4T tegrastats
  # stream without adding an image or package. The exporter bounds line/label
  # cardinality and stays unready until it has a fresh parsed sample. Bind it
  # only to Docker's private host gateway:
  # bridged Prometheus can scrape it, while no physical interface exposes it.
  tegrastats-exporter:
    image: nvcr.io/nvidia/vss-core/vss-agent:${VSS_AGENT_VERSION}
    container_name: tegrastats-exporter
    entrypoint:
      - /usr/local/bin/python3
      - /opt/thor-observability/tegrastats_exporter.py
    command:
      - --bind-address
      - "${TEGRASTATS_BIND_ADDRESS:-127.0.0.1}"
      - --port
      - "${TEGRASTATS_PORT:-19101}"
      - --interval-ms
      - "${TEGRASTATS_INTERVAL_MS:-1000}"
      - --loader
      - /opt/tegrastats-runtime/ld-linux-aarch64.so.1
      - --library-path
      - /opt/tegrastats-runtime
    network_mode: host
    pid: host
    runtime: nvidia
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${VSS_REPO_ROOT}/deploy/docker/thor-local/observability/tegrastats_exporter.py:/opt/thor-observability/tegrastats_exporter.py:ro
      - /usr/bin/tegrastats:/usr/local/bin/tegrastats:ro
      - /lib/aarch64-linux-gnu/ld-linux-aarch64.so.1:/opt/tegrastats-runtime/ld-linux-aarch64.so.1:ro
      - /lib/aarch64-linux-gnu/libc.so.6:/opt/tegrastats-runtime/libc.so.6:ro
      - /lib/aarch64-linux-gnu/libm.so.6:/opt/tegrastats-runtime/libm.so.6:ro
      - /sys:/sys:ro
    tmpfs:
      - /tmp:size=4m,mode=1777
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/python3
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0) if urllib.request.urlopen('http://${TEGRASTATS_BIND_ADDRESS:-127.0.0.1}:${TEGRASTATS_PORT:-19101}/readyz', timeout=3).getcode() == 200 else sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: always
    logging:
      driver: local
      options:
        max-size: "${MONITORING_LOG_MAX_SIZE:-10m}"
        max-file: "${MONITORING_LOG_MAX_FILES:-3}"

  streamprocessing-ms:
    image: ${THOR_LOCAL_VST_STREAM_PROCESSOR_IMAGE:-vss-vios-streamprocessing:3.2.1-thor-local}
    build:
      context: ${VSS_REPO_ROOT}
      dockerfile: deploy/docker/thor-local/Dockerfile.vios-streamprocessing
      network: none
      args:
        VST_STREAM_PROCESSOR_BASE_IMAGE: ${VST_STREAM_PROCESSOR_IMAGE:-nvcr.io/nvidia/vss-core/vss-vios-streamprocessing:3.2.1}
    # The derivative consumes a checksum-locked local bundle during a
    # networkless build and refuses any runtime package-install fallback.
    entrypoint: ["/usr/local/bin/vios-offline-entrypoint"]
    environment:
      VST_INSTALL_ADDITIONAL_PACKAGES: "false"
    # The released config falls back to public Google STUN. A loopback STUN
    # target preserves host ICE candidates while proving the Thor lane makes
    # no external WebRTC discovery calls.
    volumes:
      - ${THOR_LOCAL_VST_CONFIG_FILE:-${VSS_REPO_ROOT}/deploy/docker/thor-local/vios/vst_config.json}:/home/vst/vst_release/configs/vst_config.json:ro
    depends_on:
      centralizedb:
        condition: service_healthy
      redis:
        condition: service_healthy
      sdr-streamprocessing-init:
        condition: service_completed_successfully

  # The released ARM64 sensor image prepends the generic library directory to
  # LD_LIBRARY_PATH. On JetPack 7 that directory contains a zero-byte
  # libcuda.so.1 compatibility placeholder, while the injected Thor driver is
  # under the nvidia subdirectory. Prefer the real driver so GStreamer can load
  # the NVIDIA video decode/convert plugins used by RTSP and file ingestion.
  sensor-ms:
    environment:
      LD_LIBRARY_PATH: /usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu:/home/vst/vst_release/prebuilts/aarch64:/home/vst/vst_release/prebuilts/aarch64/gst-plugins:/home/vst/vst_release/prebuilts/aarch64/sbsa
    volumes:
      - ${THOR_LOCAL_VST_CONFIG_FILE:-${VSS_REPO_ROOT}/deploy/docker/thor-local/vios/vst_config.json}:/home/vst/vst_release/configs/vst_config.json:ro
    depends_on:
      sdr-streamprocessing-init:
        condition: service_completed_successfully

  # NVIDIA's split VIOS services publish camera_proxy/camera_remove requests
  # to Redis, but the released developer graph omits the SDR dispatcher that
  # forwards those requests to the stream processor. Seed the durable consumer
  # group at Redis '$' before either VIOS producer starts. That preserves normal
  # at-least-once delivery across reboots without replaying historical events
  # the first time this Thor-local service is introduced.
  sdr-streamprocessing-init:
    image: redis:8.6.2-alpine@sha256:c5e375abb885e6b2021c0377879e4890bf76f9065b8922ffc113f2b226b9fc17
    network_mode: host
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if reply="$$(redis-cli -h 127.0.0.1 -p 6379 XGROUP CREATE
        vst.event sdr-streamprocessing-vios-cg '$$' MKSTREAM 2>&1)"; then
          printf '%s\n' "$$reply";
        elif printf '%s\n' "$$reply" | grep -q BUSYGROUP; then
          printf '%s\n' 'SDR Redis consumer group already exists';
        else
          printf '%s\n' "$$reply" >&2;
          exit 1;
        fi
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "2m"
        max-file: "2"

  # Single-replica local SDR dispatcher. It talks to Redis and VIOS through
  # Docker's private host gateway, while its own health endpoint is published
  # on loopback only. The Docker socket is required by NVIDIA SDR to discover
  # the one fixed stream-processing target; workload restart-on-add-failure is
  # explicitly disabled.
  sdr-streamprocessing:
    image: nvcr.io/nvidia/vss-core/sdr:3.1.0@sha256:d9912bc9b412188b9beae5948f93a1be2a86affdb3df1a0e0c1933bb1c05d24d
    container_name: vss-vios-sdr
    user: "0:0"
    ports:
      - "127.0.0.1:${SDR_STREAMPROCESSING_PORT:-4003}:4003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "sdr-controller-service.default.svc.cluster.local:127.0.0.1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VSS_REPO_ROOT}/deploy/docker/thor-local/vios/sdr/docker_cluster_config.json:/wdm-configs/docker_cluster_config.json:ro
    environment:
      PORT: "4003"
      CONTAINER_NAME: vss-vios-sdr
      WDM_CLUSTER_CONFIG_FILE: /wdm-configs/docker_cluster_config.json
      WDM_MSG_KEY: vst.event
      WDM_MSG_TOPIC: vst.event
      WDM_WL_REDIS_SERVER: host.docker.internal
      WDM_WL_REDIS_PORT: "6379"
      WDM_WL_REDIS_MSG_FIELD: sensor.id
      WDM_WL_ADD_URL: /api/v1/proxy/stream/add
      WDM_WL_DELETE_URL: /api/v1/proxy/stream/
      WDM_WL_HEALTH_CHECK_URL: /api/v1/proxy/configuration
      WDM_WL_CHANGE_ID_ADD: camera_proxy
      WDM_WL_CHANGE_ID_DEL: camera_remove
      WDM_PRELOAD_WORKLOAD: ""
      WDM_CLEAR_DATA_WL: "true"
      WDM_KFK_ENABLE: "false"
      WDM_DS_SWAP_ID_NAME: "false"
      WDM_WL_THRESHOLD: "100"
      WDM_ADD_REMOVE_RETRY_ATTEMPTS: "50"
      WDM_CLUSTER_TYPE: docker
      WDM_POD_WATCH_DOCKER_DELAY: "0.5"
      WDM_RESTART_DS_ON_ADD_FAIL: "false"
      WDM_DISABLE_WERKZEUG_LOGGING: "true"
      WDM_WL_OBJECT_NAME: streamprocessing-ms
      WDM_CONSUMER_GRP_ID: sdr-streamprocessing-vios-cg
      WDM_CLUSTER_CONTAINER_NAMES: '["vss-vios-streamprocessing"]'
      WDM_TARGET_PORT_MAPPING: '{"vss-vios-streamprocessing": 30001}'
      WDM_REDIS_CACHE_OBJECT: streamprocessing-data
      WDM_WL_NAME_IGNORE_REGEX: ""
      WDM_INITIALIZE_FROM_VST: "false"
      VST_STREAMS_ENDPOINT: http://host.docker.internal:30000/api/v1/sensor/streams
      VST_STATUS_ENDPOINT: http://host.docker.internal:30000/api/v1/sensor/status
      OTEL_SDK_DISABLED: "true"
    depends_on:
      sdr-streamprocessing-init:
        condition: service_completed_successfully
      streamprocessing-ms:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/$${PORT};
          printf "GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3;
          read -r status <&3;
          [[ "$${status}" == HTTP/*" 200 "* ]]'
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  # Do not advertise ingress before both sensor control and the actual video
  # processor can serve requests.
  vst-ingress:
    image: ${THOR_LOCAL_VST_INGRESS_IMAGE:-cti-vss-vios-ingress:3.2.1-thor-local}
    build:
      context: ${VSS_REPO_ROOT}/services/vios/ui
      dockerfile: Dockerfile.thor-local
      args:
        NODE_BUILD_IMAGE: ${THOR_LOCAL_VIOS_UI_NODE_IMAGE:-node:22-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com/}
        VST_INGRESS_BASE_IMAGE: ${THOR_LOCAL_VST_INGRESS_BASE_IMAGE:-nvcr.io/nvidia/vss-core/vss-vios-ingress:3.2.1@sha256:ecee4b30ab5e76fa5d342ba4c7ade5b3f176dbb2543ccad03d07759fea2a5e47}
    depends_on:
      streamprocessing-ms:
        condition: service_healthy

  # NVIDIA ships this FastMCP gateway in the 3.2.1 source tree but omits it
  # from the released Compose graph. Build its complete dependency closure
  # from a checksum-locked AArch64 wheelhouse, expose only Thor loopback, and
  # retain FastMCP's DNS-rebinding protection. The similarly named
  # VST_MCP_URL remains the Agent's legacy VIOS REST endpoint.
  vios-mcp:
    image: ${THOR_LOCAL_VIOS_MCP_IMAGE:-cti-vss-vios-mcp:thor-local}
    build:
      context: ${VSS_REPO_ROOT}
      dockerfile: deploy/docker/thor-local/Dockerfile.vios-mcp
      network: none
      args:
        PYTHON_BASE_IMAGE: ${VIOS_MCP_PYTHON_BASE_IMAGE:-python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c}
    container_name: vss-vios-mcp
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=8m,mode=1777
    environment:
      MCP_GATEWAY_CPP_API_BASE_URL: http://127.0.0.1:${VST_PORT:-30888}/vst
      MCP_GATEWAY_SERVER_HOST: 127.0.0.1
      MCP_GATEWAY_SERVER_PORT: "${VST_MCP_PORT:-8001}"
      MCP_GATEWAY_ALLOW_ALL_HOSTS: "false"
    command:
      - --transport
      - http
      - --host
      - 127.0.0.1
      - --port
      - "${VST_MCP_PORT:-8001}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import http.client,sys;
          c=http.client.HTTPConnection('127.0.0.1',${VST_MCP_PORT:-8001},timeout=3);
          c.request('GET','/mcp',headers={'Accept':'application/json'});
          sys.exit(0 if c.getresponse().status in (200,400,406) else 1)
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      vst-ingress:
        condition: service_healthy
    restart: always

  vss-haproxy-ingress:
    environment:
      PHOENIX_HOST: 127.0.0.1
    depends_on:
      vst-ingress:
        condition: service_healthy
      vss-agent:
        condition: service_healthy

  vss-va-mcp:
    environment:
      PYTHONPATH: /vss-agent/thor-local-src
      # VA-MCP has no authentication layer. The Thor Agent is co-resident on
      # the host network, so neither the physical interface nor 0.0.0.0 is
      # needed for this control plane.
      VSS_AGENT_HOST: 127.0.0.1
    volumes:
      - ${VSS_REPO_ROOT}/services/agent/src:/vss-agent/thor-local-src:ro
    command: !override
      - mcp
      - serve
      - --config_file
      - ${VSS_VA_MCP_CONFIG_FILE}
      - --host
      - 127.0.0.1
      - --port
      - ${VSS_VA_MCP_PORT}
    healthcheck:
      test: !override
        - CMD
        - /usr/local/bin/python3
        - -c
        - >-
          import urllib.request; import sys;
          sys.exit(0 if urllib.request.urlopen(
          'http://127.0.0.1:${VSS_VA_MCP_PORT}/health',
          timeout=5).status == 200 else 1)

  vss-agent:
    environment:
      PYTHONPATH: /vss-agent/thor-local-src
      PHOENIX_ENDPOINT: http://127.0.0.1:${PHOENIX_PORT:-6006}
      VIDEO_ANALYSIS_MCP_URL: http://127.0.0.1:${VSS_VA_MCP_PORT:-9901}
    volumes:
      - ${VSS_REPO_ROOT}/services/agent/src:/vss-agent/thor-local-src:ro
      - ${VSS_DATA_DIR}/agent-reports:/vss-agent/agent_reports:rw
    depends_on:
      vst-ingress:
        condition: service_healthy
      phoenix:
        condition: service_healthy

  # Jetson/Thor requires the NVIDIA runtime itself; a generic GPU device
  # reservation alone causes the Jetson container runtime hook to reject it.
  rtvi-embed:
    image: ${THOR_LOCAL_RTVI_EMBED_IMAGE:-cti-vss-rt-embed:thor-local}
    build:
      context: ${VSS_REPO_ROOT}/services/rtvi/rt-embed
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ${RTVI_EMBED_BASE_IMAGE:-nvcr.io/nvidia/vss-core/vss-rt-embed:3.2.1}
    runtime: nvidia
    # The local embedding API has no Bearer-token gate. Keep its host
    # publication on loopback; the host-network Agent uses the matching
    # COSMOS_EMBED_ENDPOINT instead of the physical HOST_IP.
    ports: !override
      - "${THOR_LOCAL_RTVI_EMBED_BIND_ADDRESS:-127.0.0.1}:${RTVI_EMBED_PORT?}:8000"
    # The upstream auto-size selects 64 and allocates roughly 20 GiB of
    # activation memory. This profile has one stream and co-resident local
    # LLM/VLM endpoints, so batch 8 preserves throughput headroom without
    # exhausting Thor's unified memory.
    environment:
      VLM_BATCH_SIZE: "${RTVI_EMBED_BATCH_SIZE:-8}"
      RTVI_OFFLINE: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NGC_CLI_API_KEY: ""
      NGC_API_KEY: ""
      NVIDIA_API_KEY: ""
      HF_TOKEN: ""
      # URL ingestion keeps private-network SSRF blocking by default. Permit
      # only Docker's exact local host-gateway name so an owned, gateway-bound
      # media fixture can exercise HTTP URL ingestion without allowing CIDRs,
      # IP literals, suffixes, wildcards, or redirect targets.
      ASSET_DOWNLOAD_ALLOWED_PRIVATE_HOSTS: "${THOR_LOCAL_RTVI_EMBED_ALLOWED_PRIVATE_HOSTS:-host.docker.internal}"
      # Kafka is already enabled by the full profile. Thor's Redis is
      # host-networked, so expose its optional error bus through the private
      # host gateway and keep it enabled for the complete local integration.
      ENABLE_REDIS_ERROR_MESSAGES: "${THOR_LOCAL_RTVI_EMBED_REDIS_ERRORS_ENABLED:-true}"
      REDIS_HOST: "${THOR_LOCAL_RTVI_REDIS_HOST:-host.docker.internal}"
      # Use the local console exporter by default: it exercises real OTel spans
      # without requiring an external collector, and keeps telemetry on Thor.
      ENABLE_OTEL_MONITORING: "${THOR_LOCAL_RTVI_EMBED_OTEL_ENABLED:-true}"
      OTEL_TRACES_EXPORTER: "${THOR_LOCAL_RTVI_EMBED_OTEL_TRACES_EXPORTER:-console}"
      OTEL_METRICS_EXPORTER: "${THOR_LOCAL_RTVI_EMBED_OTEL_METRICS_EXPORTER:-none}"
      OTEL_SERVICE_NAME: "vss-rtvi-embed-thor-local"

  # The local OpenAI-compatible Qwen endpoint accepts one sequence at a time.
  # Pin RTVI to the same concurrency contract: the released launcher otherwise
  # auto-selects batch 128 from Thor's total unified memory and advertises ten
  # VLM processes even though openai-compat creates only one. Blank the model
  # API variables here so the NGC credential used by connected staging can
  # never be copied into the long-running local proxy container.
  rtvi-vlm:
    image: ${THOR_LOCAL_RTVI_VLM_IMAGE:-cti-vss-rt-vlm:thor-local}
    build:
      context: ${VSS_REPO_ROOT}/services/rtvi/rt-vlm
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ${RTVI_VLM_BASE_IMAGE:-nvcr.io/nvidia/vss-core/vss-rt-vlm:3.2.1}
    # RT-VLM has no application-level authentication when the local exact
    # model lane blanks API credentials. Keep the host publication local;
    # host-network VSS consumers use 127.0.0.1 and bridge consumers use the
    # Compose service name on port 8000.
    ports: !override
      - "${THOR_LOCAL_RTVI_VLM_BIND_ADDRESS:-127.0.0.1}:${RTVI_VLM_PORT?}:8000"
    environment:
      VLM_BATCH_SIZE: "${RTVI_VLM_BATCH_SIZE:-1}"
      NUM_VLM_PROCS: "${RTVI_VLM_NUM_VLM_PROCS:-1}"
      VIA_VLM_API_KEY: "${RTVI_VLM_API_KEY:-}"
      NGC_API_KEY: ""
      # NVIDIA's LVS custom-model contract supplies a model selector plus a
      # MODEL_ROOT_DIR bind.  Keep the host and container path identical so
      # RTVI_VLM_MODEL_PATH can name a checkpoint below this root without a
      # Thor-specific path translation.
      MODEL_ROOT_DIR: "${MODEL_ROOT_DIR:-/tmp/model_cache}"
      # Redis is host-networked and bound to Docker's private host-gateway
      # address in this profile; the upstream bridge-local name `redis` is not
      # resolvable from RT-VLM. This keeps the optional Redis error bus local
      # while making ENABLE_REDIS_ERROR_MESSAGES=true functional on Thor.
      REDIS_HOST: "${THOR_LOCAL_RTVI_REDIS_HOST:-host.docker.internal}"
    volumes:
      - "${MODEL_ROOT_DIR:-/tmp/model_cache}:${MODEL_ROOT_DIR:-/tmp/model_cache}:ro"

  # Preserve NVIDIA's released Alert Bridge while replacing only its default
  # schema modules. This lets API, agent, and UI callers omit hardware tuning
  # fields without accidentally asking a four-image local VLM for 300 frames.
  alert-bridge:
    image: ${THOR_LOCAL_ALERT_BRIDGE_IMAGE:-cti-vss-alert-bridge:thor-local}
    build:
      context: ${VSS_REPO_ROOT}
      dockerfile: deploy/docker/thor-local/Dockerfile.alert-bridge
      args:
        ALERT_BRIDGE_BASE_IMAGE: ${ALERT_BRIDGE_IMAGE:-nvcr.io/nvidia/vss-core/vss-alert-verification:3.2.0}
    environment:
      VLM_WARMUP_ENABLED: "false"
      REALTIME_ALERT_CHUNK_DURATION: ${REALTIME_ALERT_CHUNK_DURATION:-10}
      REALTIME_ALERT_CHUNK_OVERLAP_DURATION: ${REALTIME_ALERT_CHUNK_OVERLAP_DURATION:-2}
      REALTIME_ALERT_FRAMES_PER_CHUNK: ${REALTIME_ALERT_FRAMES_PER_CHUNK:-4}
      REALTIME_ALERT_USE_FPS: ${REALTIME_ALERT_USE_FPS:-false}
      REALTIME_ALERT_VLM_INPUT_WIDTH: ${REALTIME_ALERT_VLM_INPUT_WIDTH:-512}
      REALTIME_ALERT_VLM_INPUT_HEIGHT: ${REALTIME_ALERT_VLM_INPUT_HEIGHT:-512}
      REALTIME_ALERT_ENABLE_REASONING: ${REALTIME_ALERT_ENABLE_REASONING:-false}
      REALTIME_ALERT_MAX_TOKENS: ${REALTIME_ALERT_MAX_TOKENS:-128}
      REALTIME_ALERT_ENABLE_AUDIO: ${REALTIME_ALERT_ENABLE_AUDIO:-false}
      ALERT_VERIFICATION_MEDIA_MODE: snapshots
      ALERT_VERIFICATION_SNAPSHOT_FRAMES: "4"
      ALERT_VERIFICATION_RESPONSE_FORMAT: json
      ALERT_VERIFICATION_NUM_WORKERS: "1"
      ALERT_VERIFICATION_ASYNC_IO: "false"
      ALERT_VERIFICATION_OVERRIDE_PROMPTS: "false"
      # Export Alert Bridge pipeline metrics from the main host-network
      # process on a dedicated loopback port for the Thor Prometheus stack.
      PROMETHEUS_METRICS_ENABLED: "true"
      PROMETHEUS_PORT: "${ALERT_PROMETHEUS_PORT:-9081}"
      # The local JSON verifier must produce confirmed/rejected incidents;
      # upstream keeps direct-media parsing in freestyle mode by default.
      ALERT_DIRECT_MEDIA_USE_VERDICT: "true"

  # Stored-caption Q&A uses the graph backend selected by NVIDIA's LVS 3.2.1
  # config. Keep the authenticated Community instance strictly on loopback;
  # neither Bolt nor its browser/API listener is reachable from the LAN. The
  # shared password is generated only in gitignored generated.env (mode 0600).
  graph-db:
    image: ${THOR_LOCAL_NEO4J_IMAGE:-neo4j:5.26-community@sha256:d9dd3dc7d1c78fa959191ff02dbdcbefadceaf83eee23428fb92a58cac8ad3fe}
    container_name: vss-graph-db
    profiles: ["bp_developer_lvs_2d", "bp_developer_thor_full_2d"]
    network_mode: host
    ports: !override []
    environment:
      NEO4J_AUTH: neo4j/${GRAPH_DB_PASSWORD:?GRAPH_DB_PASSWORD is required; run thor-local.sh refresh-runtime}
      NEO4J_server_default__listen__address: 127.0.0.1
      NEO4J_server_bolt_listen__address: 127.0.0.1:7687
      NEO4J_server_http_listen__address: 127.0.0.1:7474
      NEO4J_server_https_enabled: "false"
      # CA-RAG's released GraphRAG implementation uses APOC Core procedures
      # such as apoc.meta.data and apoc.coll.toSet. The pinned Neo4j image
      # already carries the matching jar under /var/lib/neo4j/labs; this
      # enables that local copy without downloading a plugin at runtime.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - ${VSS_DATA_DIR}/neo4j/data:/data
      - ${VSS_DATA_DIR}/neo4j/logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:7474/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: always
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  # Add a provider-aware derivative on top of NVIDIA's released LVS image.
  # Generic OpenAI/NIM requests remain unchanged; local vLLM can explicitly
  # disable Qwen thinking so a one-event summary cannot consume 10k tokens.
  lvs-server:
    image: ${THOR_LOCAL_LVS_IMAGE:-cti-vss-video-summarization:thor-local}
    build:
      context: ${VSS_REPO_ROOT}
      dockerfile: deploy/docker/thor-local/Dockerfile.video-summarization
      args:
        LVS_BASE_IMAGE: ${LVS_IMAGE:-nvcr.io/nvidia/vss-core/vss-video-summarization}:${LVS_TAG:-3.2.1}
    environment:
      LVS_LLM_MODEL_TYPE: ${LLM_MODEL_TYPE:-openai}
      LVS_LLM_ENABLE_THINKING: ${LVS_LLM_ENABLE_THINKING:-false}
      LVS_LLM_MAX_TOKENS: ${LVS_LLM_MAX_TOKENS:-1024}
      LVS_MCP_HOST: 127.0.0.1
      LVS_MCP_MEDIA_ROOT: /opt/nvidia/via/mcp-media
      LVS_MCP_MAX_FILE_BYTES: ${LVS_MCP_MAX_FILE_BYTES:-8589934592}
      LVS_MCP_MAX_SSE_BYTES: ${LVS_MCP_MAX_SSE_BYTES:-4194304}
      LVS_MCP_MAX_SSE_EVENTS: ${LVS_MCP_MAX_SSE_EVENTS:-1024}
      LVS_MCP_SSE_TIMEOUT_SECONDS: ${LVS_MCP_SSE_TIMEOUT_SECONDS:-600}
      VIA_FILE_API_LOOPBACK_ONLY: "true"
      VIA_FILE_API_ALLOW_FILENAME: "false"
      LVS_QA_DATABASE_BACKEND: graph_db
      LVS_INGESTION_FUNCTION: graph_ingestion
      LVS_RETRIEVER_FUNCTION: graph_retrieval
      GRAPH_DB_HOST: 127.0.0.1
      GRAPH_DB_HTTP_PORT: "7474"
      GRAPH_DB_BOLT_PORT: "7687"
      GRAPH_DB_USERNAME: neo4j
      GRAPH_DB_PASSWORD: ${GRAPH_DB_PASSWORD:?GRAPH_DB_PASSWORD is required; run thor-local.sh refresh-runtime}
    volumes:
      - ${VSS_DATA_DIR}/videos:/opt/nvidia/via/mcp-media:ro
    depends_on:
      graph-db:
        condition: service_healthy

  vss-ui:
    image: vss-agent-ui:thor-local
    build:
      context: ${VSS_REPO_ROOT}
      dockerfile: services/ui/Dockerfile
      args:
        BUILD_TYPE: prod
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
        RUNTIME_IMAGE_PROD: node:22.22.3-bookworm-slim
        RUNTIME_IMAGE_DEV: node:22.22.3-bookworm-slim
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DASHBOARD_KIBANA_INTERNAL_URL: http://host.docker.internal:${KIBANA_PORT:-5601}/kibana
