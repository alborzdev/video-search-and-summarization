# Pull-free, opt-in NVIDIA Thor official edge model lane.
services:
  perception-2d-fusion:
    restart: unless-stopped

  nemotron-edge:
    image: ghcr.io/nvidia-ai-iot/vllm@sha256:b587dd56b4cb076209ad5156a626ac75f5a976d0e8e7d1e6a9fccd56d1bd65e8
    container_name: vss-nemotron-edge-4b
    profiles: ["bp_developer_thor_full_2d"]
    network_mode: host
    runtime: nvidia
    # Compose ordering is not replayed by Docker's restart manager after a
    # host reboot. Keep this lightweight process waiting until Cosmos has
    # claimed its larger unified-memory allocation, then start the Edge LLM.
    entrypoint:
      - python3
      - /usr/local/bin/thor-startup-gate.py
      - --http
      - http://127.0.0.1:8018/v1/health/ready
      - --
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /runtime/huggingface
      XDG_CACHE_HOME: /runtime/cache
      XDG_CONFIG_HOME: /runtime/config
      FLASHINFER_WORKSPACE_BASE: /runtime/cache
      TRITON_CACHE_DIR: /runtime/cache/triton
      TORCHINDUCTOR_CACHE_DIR: /runtime/cache/torchinductor
      VLLM_CACHE_ROOT: /runtime/cache/vllm
      CUDA_CACHE_PATH: /runtime/cache/cuda
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - ${THOR_OFFICIAL_EDGE4B_SNAPSHOT:?Set the exact verified Edge4B snapshot path}:/models/edge4b:ro
      # Hugging Face cache snapshots are symlink forests whose ../../blobs/*
      # targets resolve to /blobs/* from /models/edge4b. Mount the separately
      # verified sibling blob store so the immutable snapshot is usable.
      - ${THOR_OFFICIAL_EDGE4B_BLOBS_DIR:?Set the exact verified Edge4B blobs path}:/blobs:ro
      - ${VSS_REPO_ROOT:?Set the VSS repository root}/deploy/docker/thor-local/startup-gate.py:/usr/local/bin/thor-startup-gate.py:ro
    tmpfs:
      - /tmp:size=2g,mode=1777,exec,nosuid,nodev
      - /runtime:size=8g,mode=0700,exec,nosuid,nodev
    command:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
      - --model
      - /models/edge4b
      - --tokenizer
      - /models/edge4b
      - --served-model-name
      - nvidia/NVIDIA-Nemotron-3-Nano-4B-FP8
      - --trust-remote-code
      - --host
      - 127.0.0.1
      - --port
      - "30081"
      - --gpu-memory-utilization
      - "0.25"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:30081/v1/models',timeout=5).status == 200 else 1)
      interval: 15s
      timeout: 8s
      retries: 60
      start_period: 300s
    restart: unless-stopped
    depends_on:
      rtvi-vlm:
        condition: service_healthy

  rtvi-vlm:
    image: nvcr.io/nvidia/vss-core/vss-rt-vlm@sha256:5403e0c8fa8b149e7ad15ab1b063b78d610e7a50297dba6ca550ac5cc5ef9504
    environment:
      VIA_VLM_OPENAI_MODEL_DEPLOYMENT_NAME: nim_nvidia_cosmos3-nano-reasoner_bf16-final
      VIA_VLM_ENDPOINT: ""
      VIA_VLM_API_KEY: ""
      NGC_API_KEY: ""
      NVIDIA_API_KEY: ""
      HF_TOKEN: ""
      OPENAI_API_KEY: ""
      VLM_MODEL_TO_USE: cosmos-reason3
      MODEL_PATH: ngc:nim/nvidia/cosmos3-nano-reasoner:bf16-final
      # Thor shares CPU and GPU memory. A utilization fraction alone makes
      # Cosmos consume anywhere from ~3 GiB to ~40 GiB of KV cache depending
      # on which peer models happened to start first. Pin the cache instead:
      # 4 GiB comfortably covers one 16K request (vLLM reports ~2.25 GiB) and
      # preserves deterministic appliance headroom for CV, Embed, and Edge4B.
      VLLM_GPU_MEMORY_UTILIZATION: "0.30"
      VLLM_KV_CACHE_MEMORY_BYTES: "4294967296"
      VLLM_MAX_NUM_BATCHED_TOKENS: "4096"
      # Cosmos3's Qwen3-VL backbone reproducibly fails the vLLM 0.12 CUDA
      # graph warm-up on Thor with a dynamic-shape assertion. Eager mode is
      # the runtime's supported fallback and avoids an endless 16.7 GiB
      # model reload loop while preserving the same model and context limits.
      VLLM_ENFORCE_EAGER: "true"
      VLM_MAX_MODEL_LEN: "16384"
      VLM_MAX_GENERATION_TOKENS: "4096"
      VLLM_MAX_NUM_SEQS: "1"
      VLM_BATCH_SIZE: "1"
      NUM_VLM_PROCS: "1"
    volumes:
      - ${THOR_OFFICIAL_COSMOS3_CACHE_ROOT:?Set the parent of the exact verified Cosmos3 NGC cache path}:/opt/nvidia/rtvi/.rtvi/ngc_model_cache
      - ${VSS_REPO_ROOT:?Set the VSS repository root}/services/rtvi/rt-vlm/src/api_models/captions.py:/opt/nvidia/rtvi/rtvi/api_models/captions.py:ro
      - ${VSS_REPO_ROOT:?Set the VSS repository root}/services/rtvi/rt-vlm/src/api_models/live_stream.py:/opt/nvidia/rtvi/rtvi/api_models/live_stream.py:ro
      - ${VSS_REPO_ROOT:?Set the VSS repository root}/services/rtvi/rt-vlm/src/utils/asset_manager.py:/opt/nvidia/rtvi/rtvi/utils/asset_manager.py:ro
      - ${VSS_REPO_ROOT:?Set the VSS repository root}/services/rtvi/rt-vlm/src/server/rtvi_vlm_server.py:/opt/nvidia/rtvi/rtvi/server/rtvi_vlm_server.py:ro
      - ${VSS_REPO_ROOT:?Set the VSS repository root}/services/rtvi/rt-vlm/src/server/rtvi_stream_handler.py:/opt/nvidia/rtvi/rtvi/server/rtvi_stream_handler.py:ro
      - ${VSS_REPO_ROOT:?Set the VSS repository root}/services/rtvi/rt-vlm/src/vlm_pipeline/vlm_pipeline.py:/opt/nvidia/rtvi/rtvi/vlm_pipeline/vlm_pipeline.py:ro
      - ${VSS_REPO_ROOT:?Set the VSS repository root}/services/rtvi/rt-vlm/src/vlm_pipeline/process_base.py:/opt/nvidia/rtvi/rtvi/vlm_pipeline/process_base.py:ro

  vss-agent:
    environment:
      NVIDIA_API_KEY: ""
      OPENAI_API_KEY: ""
      HF_TOKEN: ""
      RAG_API_KEY: ""
      LLM_MODE: remote
      LLM_MODEL_TYPE: vllm
      LLM_NAME: nvidia/NVIDIA-Nemotron-3-Nano-4B-FP8
      LLM_BASE_URL: http://127.0.0.1:30081
      VLM_MODE: local_shared
      VLM_MODEL_TYPE: rtvi
      VLM_NAME: nim_nvidia_cosmos3-nano-reasoner_bf16-final
      VLM_BASE_URL: http://127.0.0.1:8018
      # VIOS's synchronous MP4 muxer can reject otherwise-retained RTSP
      # segments with discontinuous source timestamps. The loopback support
      # service rebuilds those clips from the exact retained MKV media so
      # operator-requested evidence inspection remains reliable.
      VST_CLIP_FALLBACK_URL: http://127.0.0.1:${THOR_LOCAL_EVIDENCE_CLIP_PORT:-8098}
      # RTVI-VLM deliberately blocks loopback media URLs as SSRF protection.
      # Serve the prepared clip through the same LAN-safe application origin
      # already allow-listed for native VST evidence.
      VST_CLIP_FALLBACK_MEDIA_URL: ${VST_EXTERNAL_URL}/api/vision/evidence-media
      # Evidence inspection is an operator action and must remain available
      # while the same local Cosmos service captions a live stream. RTVI-VLM
      # serializes the bounded file requests; the 16K local context contract
      # leaves enough room for the configured evidence frame sample.
      EVIDENCE_ALLOW_FRESH_INSPECTION_WHILE_BUSY: "true"
      EVIDENCE_FRESH_INSPECTION_TIMEOUT_SECONDS: "120"
      VSS_AGENT_CONFIG_FILE: /vss-agent/deploy/docker/thor-local/official-edge/config_edge.yml
    command:
      - serve
      - --config_file
      - /vss-agent/deploy/docker/thor-local/official-edge/config_edge.yml
      - --host
      - ${VSS_AGENT_HOST}
      - --port
      - ${VSS_AGENT_PORT}
    depends_on:
      nemotron-edge:
        condition: service_healthy
      rtvi-vlm:
        condition: service_healthy

  # Consumers of the loopback-only local model must not inherit operator or
  # placeholder credentials from generated.env. Keep this fail-closed even
  # when Compose is invoked directly instead of through the command renderer.
  lvs-server:
    environment:
      NVIDIA_API_KEY: ""
      OPENAI_API_KEY: ""
      LVS_LLM_API_KEY: ""
      LVS_LLM_MODEL_NAME: nvidia/NVIDIA-Nemotron-3-Nano-4B-FP8
      LVS_LLM_BASE_URL: http://127.0.0.1:30081/v1
      LVS_LLM_MODEL_TYPE: vllm
      VIA_VLM_OPENAI_MODEL_DEPLOYMENT_NAME: nim_nvidia_cosmos3-nano-reasoner_bf16-final
      RTVI_VLM_URL: http://127.0.0.1:8018
      VIA_VLM_ENDPOINT: http://127.0.0.1:8018/v1/

  vss-ui:
    environment:
      # The base Thor renderer intentionally uses a non-runnable placeholder
      # model identity. UI-owned live-caption reservations must restore the
      # actual Cosmos model selected by this official-edge overlay.
      LVS_VLM_MODEL: nim_nvidia_cosmos3-nano-reasoner_bf16-final

  vss-va-mcp:
    environment:
      NVIDIA_API_KEY: ""
      OPENAI_API_KEY: ""
      HF_TOKEN: ""
      LLM_MODEL_TYPE: vllm
      LLM_NAME: nvidia/NVIDIA-Nemotron-3-Nano-4B-FP8
      LLM_BASE_URL: http://127.0.0.1:30081

  alert-bridge:
    environment:
      NVIDIA_API_KEY: ""
      OPENAI_API_KEY: ""
      HF_TOKEN: ""
      VLM_MODE: local_shared
      VLM_NAME: nim_nvidia_cosmos3-nano-reasoner_bf16-final
      VLM_BASE_URL: http://127.0.0.1:8018
      RTVI_VLM_BASE_URL: http://127.0.0.1:8018
