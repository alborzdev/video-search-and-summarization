# Thor-local has no qualified DCGM exporter. Keep this configuration separate
# from the warehouse monitoring config so every declared target corresponds to
# a service selected by bp_developer_thor_full_2d.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # The exporter is a Thor-only host-network service bound exclusively to
  # Docker's private host gateway. It is not exposed on a physical interface.
  - job_name: 'tegrastats-exporter'
    static_configs:
      - targets: ['host.docker.internal:19101']

  - job_name: 'rtvi-vlm'
    metrics_path: /v1/metrics
    static_configs:
      - targets: ['rtvi-vlm:8000']

  - job_name: 'rtvi-embed'
    metrics_path: /v1/metrics
    static_configs:
      - targets: ['rtvi-embed:8000']

  # LVS uses host networking, so the Prometheus bridge reaches its always-on
  # source-defined /metrics route through Docker's private host gateway.
  - job_name: 'lvs'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:38111']

  # Alert Bridge runs in host-network mode and exports its process/pipeline
  # registry on the dedicated port selected by the Thor overlay.
  - job_name: 'alert-bridge'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9081']
