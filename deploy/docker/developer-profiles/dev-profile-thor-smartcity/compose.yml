# Smart City remains available as its original complete profile. The separate
# traffic-perception profile is also used by CTAILabs VSS as a second,
# VSS-owned model worker: warehouse RT-CV stays on 9000 while traffic RT-CV
# listens on 9010. Sources are routed to exactly one worker by the Agent.
services:
  perception-2d-smartcity-thor:
    extends:
      file: ${VSS_APPS_DIR}/services/rtvi/rtvi-cv/compose.yaml
      service: perception
    profiles: ["bp_developer_thor_smartcity_2d", "bp_developer_thor_traffic_perception_2d"]
    container_name: vss-rtvi-cv-traffic
    entrypoint: ["/usr/local/bin/rtvi-cv-supervisor"]
    restart: unless-stopped
    # The NVIDIA RT-CV base limits restart attempts to two. That is too
    # brittle on Thor after a host reboot: DeepStream can reach nvmsgbroker
    # before Kafka is actually accepting clients and exhaust both attempts.
    # Override the inherited policy with unlimited retries; the direct Kafka
    # health dependency below handles normal Compose-managed startup ordering.
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
    volumes:
      - ${VSS_DATA_DIR}/models/:/opt/storage/
      - ${VSS_APPS_DIR}/engines/:/opt/engines/
      - ${VSS_APPS_DIR}/developer-profiles/dev-profile-alerts/deepstream/configs/:/opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app/mounted-configs/:ro
      - ${VSS_REPO_ROOT}/deploy/docker/thor-local/rtvi-cv-healthcheck.sh:/usr/local/bin/rtvi-cv-healthcheck:ro
      - ${VSS_REPO_ROOT}/deploy/docker/thor-local/rtvi-cv-supervisor.sh:/usr/local/bin/rtvi-cv-supervisor:ro
    environment:
      # The released RT-CV launcher uses DGX-THOR as its Jetson/Thor tuning
      # selector even though the overall profile is named AGX-THOR.
      HARDWARE_PROFILE: DGX-THOR
      MODEL_TYPE: cnn
      STREAM_TYPE: kafka
      MODEL_NAME_2D: RTDETR
      NUM_SENSORS: "1"
      DS_MODEL_FAMILY: rtdetr-gdino
      DS_TRACKER_REID: "false"
      DS_SHOW_SENSOR_ID: "true"
      DS_CONFIG_FILE: /opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app/configs/run_config-api-rtdetr-protobuf.txt
      OTEL_SERVICE_NAME: rtvi-cv-traffic
      RTVI_CV_HEALTHCHECK_URL: http://127.0.0.1:${RTVI_CV_TRAFFIC_PORT:-9010}/api/v1/health/get-dsready-state
      RTVI_CV_HEALTHCHECK_STATE_DIR: /tmp/rtvi-cv-traffic-healthcheck
    healthcheck:
      test: ["CMD", "/usr/local/bin/rtvi-cv-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    depends_on:
      sensor-ms:
        condition: service_started
      kafka:
        condition: service_healthy
      broker-health-check:
        condition: service_completed_successfully

  vss-behavior-analytics-smartcity-thor:
    extends:
      file: ${VSS_APPS_DIR}/services/analytics/behavior-analytics/compose.yml
      service: vss-behavior-analytics-base
    profiles: ["bp_developer_thor_smartcity_2d"]
    container_name: vss-behavior-analytics-smartcity-thor
    image: ${THOR_LOCAL_BEHAVIOR_ANALYTICS_IMAGE:-cti-vss-behavior-analytics:thor-local}
    build:
      context: ${VSS_REPO_ROOT}
      dockerfile: deploy/docker/thor-local/Dockerfile.behavior-analytics
      args:
        BEHAVIOR_ANALYTICS_BASE_IMAGE: ${BEHAVIOR_ANALYTICS_IMAGE:-nvcr.io/nvidia/vss-core/vss-behavior-analytics:3.2.1}
    volumes:
      - ${VSS_APPS_DIR}/developer-profiles/dev-profile-thor-smartcity/vss-behavior-analytics/configs/vss-behavior-analytics-kafka-config.json:/resources/vss-behavior-analytics-config.json:ro
      - ${VSS_APPS_DIR}/developer-profiles/dev-profile-thor-smartcity/assets/calibration.json:/resources/calibration.json:ro
      - ${VSS_APPS_DIR}/developer-profiles/dev-profile-thor-smartcity/assets/agnew-head-on.graphml:/resources/agnew-head-on.graphml:ro
    command: python3 apps/smart_city/main_smart_city_app.py --config /resources/vss-behavior-analytics-config.json --calibration /resources/calibration.json
    depends_on:
      broker-health-check:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m

  smartcity-calibration-import-thor:
    image: alpine/curl:8.17.0
    profiles: ["bp_developer_thor_smartcity_2d"]
    container_name: vss-smartcity-calibration-import-thor
    network_mode: host
    restart: "no"
    entrypoint: ["/bin/sh"]
    command: ["/opt/smartcity/import-calibration.sh"]
    environment:
      VIDEO_ANALYTICS_API_URL: http://127.0.0.1:${VIDEO_ANALYTICS_API_PORT:-8081}
      SMARTCITY_IMPORT_MAX_ATTEMPTS: ${SMARTCITY_IMPORT_MAX_ATTEMPTS:-60}
      SMARTCITY_IMPORT_RETRY_SECONDS: ${SMARTCITY_IMPORT_RETRY_SECONDS:-2}
    volumes:
      - ${VSS_APPS_DIR}/developer-profiles/dev-profile-thor-smartcity/scripts/import-calibration.sh:/opt/smartcity/import-calibration.sh:ro
      - ${VSS_APPS_DIR}/developer-profiles/dev-profile-thor-smartcity/assets/calibration.json:/opt/smartcity/calibration.json:ro
      - ${VSS_APPS_DIR}/developer-profiles/dev-profile-thor-smartcity/assets/road-network.json:/opt/smartcity/road-network.json:ro
    depends_on:
      vss-video-analytics-api-fusion:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  smartcity-map-thor:
    image: alpine:3.23.4
    profiles: ["bp_developer_thor_smartcity_2d"]
    container_name: vss-smartcity-map-thor
    network_mode: host
    restart: always
    read_only: true
    command:
      - /bin/sh
      - -ec
      - exec httpd -f -p 127.0.0.1:${SMARTCITY_MAP_PORT:-3002} -h /site
    volumes:
      - ${VSS_APPS_DIR}/developer-profiles/dev-profile-thor-smartcity/map:/site:ro
      - ${VSS_APPS_DIR}/developer-profiles/dev-profile-thor-smartcity/assets:/site/assets:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${SMARTCITY_MAP_PORT:-3002}/"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 2s
    depends_on:
      smartcity-calibration-import-thor:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
