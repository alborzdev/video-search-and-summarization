functions:
  vst_sensor_list:
    _type: vst.sensor_list
    vst_internal_url: ${VST_INTERNAL_URL}

function_groups:
  video_analytics:
    _type: video_analytics
    es_url: ${ELASTIC_SEARCH_ENDPOINT}
    index_prefix: mdx-
    vlm_verified: true
    vst_sensor_list_tool: vst_sensor_list
    embedding_model_name: ${VA_EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
    include:
    - get_incident
    - get_incidents
    - get_sensor_ids
    - get_places
    - get_fov_histogram
    - get_average_speeds
    - analyze

llms:
  nim_llm:
    # The standalone VA-MCP image does not register NAT's optional `vllm`
    # provider. Local vLLM servers expose the OpenAI API, so select the
    # provider independently while retaining the same model and base URL.
    _type: ${VA_MCP_LLM_MODEL_TYPE:-openai}
    model_name: ${LLM_NAME}
    base_url: ${LLM_BASE_URL}/v1
    temperature: 0.0
    max_tokens: 1024

# A workflow is required to host the Video Analytics function group over MCP.
workflow:
  _type: react_agent
  tool_names: [video_analytics]
  llm_name: nim_llm
  verbose: true
  parse_agent_response_max_retries: 3
